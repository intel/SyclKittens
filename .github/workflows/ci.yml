name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check benchmark tooling syntax
        run: |
          bash -n benchmarks/suites/distributed.sh
          python3 -m py_compile benchmarks/tools/capture_manifest.py
